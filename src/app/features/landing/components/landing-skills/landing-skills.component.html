<div id="stack" class="skills-container pt-8 pb-8">

  <div class="skills-header flex w-full items-center justify-between mb-8">
    <h3 class="font-gloock flex items-center gap-4 text-center text-[28px] text-gray-900 dark:text-white transition-colors">
      <i class="fi fi-sr-apps text-emerald-500"></i>
      <span>{{ isFrench() ? "Ce que j'utilise" : "My Tech Stack" }}</span>
    </h3>
  </div>

  <div class="grid w-full grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5 rounded-[28px]">

    @for (skill of skills(); track skill.id) {
      <div class="skill-card flex flex-col items-center justify-center rounded-2xl p-4 gap-2 text-[15px] font-semibold text-gray-800 dark:text-gray-200 bg-gray-100 dark:bg-zinc-800/80 border border-transparent dark:border-zinc-700/50 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-emerald-500/10 hover:border-emerald-500/50 hover:cursor-pointer">

        <img
          [alt]="skill.name"
          loading="lazy"
          class="rounded-lg h-8 w-8 object-contain drop-shadow-sm"
          [src]="skill.logoUrl">
        <span class="text-center mt-1">{{ skill.name }}</span>

      </div>
    } @empty {
      <p class="text-zinc-500 italic col-span-full">Chargement des compétences...</p>
    }

  </div>
</div>

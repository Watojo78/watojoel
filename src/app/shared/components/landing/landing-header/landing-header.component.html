<div class="header-wrapper flex items-center justify-between sticky top-0 pt-4 pb-4 px-4 md:px-16 lg:px-28 z-50 bg-white/90 dark:bg-zinc-950/90 backdrop-blur-md transition-colors duration-300">

  <a [routerLink]="['/', langPrefix(), 'home']" (click)="scrollToTop()" class="header-logo cursor-pointer">
    <img
      src="../../../../../assets/common/logo/logo.png"
      alt="wtjoel_logo"
      height="28">
  </a>

  <div class="header-nav flex items-center justify-between gap-4">

    <a [routerLink]="['/', langPrefix(), 'home']" (click)="scrollToTop()" class="hidden md:block text-gray-800 dark:text-gray-200 hover:text-emerald-500 dark:hover:text-emerald-400 transition-colors cursor-pointer">
      <span>Accueil</span>
    </a>
    <a [routerLink]="['/', langPrefix(), 'home']" (click)="scrollTo('projets')" class="hidden md:block text-gray-800 dark:text-gray-200 hover:text-emerald-500 dark:hover:text-emerald-400 transition-colors cursor-pointer">
      <span>Projets</span>
    </a>
    <a [routerLink]="['/', langPrefix(), 'home']" (click)="scrollTo('expertise')" class="hidden md:block text-gray-800 dark:text-gray-200 hover:text-emerald-500 dark:hover:text-emerald-400 transition-colors cursor-pointer">
      <span>Expertise</span>
    </a>
    <a [routerLink]="['/', langPrefix(), 'home']" (click)="scrollTo('stack')" class="hidden md:block text-gray-800 dark:text-gray-200 hover:text-emerald-500 dark:hover:text-emerald-400 transition-colors cursor-pointer">
      <span>Stack</span>
    </a>
    <a [routerLink]="['/', langPrefix(), 'home']" (click)="scrollTo('contact')" class="hidden md:block text-gray-800 dark:text-gray-200 hover:text-emerald-500 dark:hover:text-emerald-400 transition-colors cursor-pointer">
      <span>Contact</span>
    </a>

    <div class="lang hidden md:block ml-4">
      <p-button
        [rounded]="true"
        severity="secondary"
        (click)="switchLanguage()">
        <img
          [src]="isFrench() ? '../../../../../assets/icons/frrect.svg' : '../../../../../assets/icons/engrect.svg'"
          [alt]="isFrench() ? 'french' : 'english'"
          height="15"
          class="h-4">
      </p-button>
    </div>

    <div class="bright hidden md:block">
      <p-toggleswitch [(ngModel)]="checked" (onChange)="toggleTheme()">
        <ng-template #handle let-checked="checked">
          <img
            [src]="checked ? '../../../../../assets/icons/moon.svg' : '../../../../../assets/icons/brightness.svg'"
            [alt]="checked ? 'moon' : 'brightness'"
            height="11">
        </ng-template>
      </p-toggleswitch>
    </div>

  </div>

  <div class="md:hidden flex items-center justify-center gap-3">

    <p-button
      [rounded]="true"
      severity="secondary"
      (click)="switchLanguage()">
      <img
        [src]="isFrench() ? '../../../../../assets/icons/frrect.svg' : '../../../../../assets/icons/engrect.svg'"
        [alt]="isFrench() ? 'french' : 'english'"
        height="15"
        class="h-4">
    </p-button>

    <p-menu
      #menu
      [model]="items()"
      [popup]="true"/>
    <p-button
      text="true"
      severity="secondary"
      (click)="menu.toggle($event)"
      class="menu-action">
      <i class="fi fi-br-bars-staggered text-xl text-gray-900 dark:text-white"></i>
    </p-button>

  </div>
</div>

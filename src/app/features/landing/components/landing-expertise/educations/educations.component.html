<div class="educations-wrapper">
  <p-timeline [value]="educations()" align="left">

    <ng-template #marker let-education>
      <span class="flex w-8 h-8 items-center justify-center rounded-full z-10 bg-white dark:bg-zinc-800 border-2 border-emerald-500 shadow-sm">
        <img
          src="../../../../../../assets/icons/graduation-cap dt.svg"
          alt="graduation"
          class="w-5 dark:invert transition-all"> </span>
    </ng-template>

    <ng-template #content let-education>
      <div class="education-content flex flex-col items-start justify-center w-full mb-4 md:mb-6">

        <div class="flex flex-col md:flex-row items-start justify-between w-full p-4 -ml-4 rounded-xl hover:bg-gray-50 dark:hover:bg-zinc-800/50 transition-colors border border-transparent hover:border-gray-200 dark:hover:border-zinc-700">

          <div>
            <h4 class="content-degree text-lg md:text-xl font-bold text-gray-900 dark:text-emerald-400">
              {{ education.degree }} {{ isFrench() ? 'en' : 'in' }} {{ education.field }}
            </h4>

            <p class="font-semibold text-gray-700 dark:text-white mt-1">
              {{ education.institution }}
            </p>

            <div class="content-period flex items-center gap-2 text-sm text-gray-600 dark:text-zinc-400 mt-3 font-medium bg-gray-100 dark:bg-zinc-900 px-3 py-1.5 rounded-full w-fit">
              <span>{{ education.startDate | date:'MMM yyyy' }}</span>
              <span> - </span>

              @if(education.isCurrent) {
                <span class="text-emerald-600 dark:text-emerald-400 font-bold">
                  {{ isFrench() ? 'Présent' : 'Present' }}
                </span>
              } @else {
                <span>{{ education.endDate | date:'MMM yyyy' }}</span>
              }
            </div>

          </div>

        </div>
      </div>
    </ng-template>

  </p-timeline>
</div>
